spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dropout}
spring.datasource.username=${DB_USERNAME:beom}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
supreme.crawler.enabled=${SUPREME_CRAWLER_ENABLED:true}
supreme.crawler.dataset=${SUPREME_DATASET:fw26-production-2026-08-16}
palace.crawler.enabled=${PALACE_CRAWLER_ENABLED:true}
sansan.crawler.enabled=${SANSAN_CRAWLER_ENABLED:true}
spao.crawler.enabled=${SPAO_CRAWLER_ENABLED:true}
